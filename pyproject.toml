[project]
name = "oslwright"
version = "0.2.7"
description = "None"
readme = "README.md"
authors = [{ name = "Anonymous", email = "noreply@example.com" }]
requires-python = ">=3.12"

dependencies = [
    "flet[all]>=1.0",
    "dacite",
    "dataclasses_json",
    "json5",
    "jsonschema",
    "lark",
    "natsort",
    "pyjson5",
    "regex",
    # "meson==1.8.*",  # Please use Meson 1.8.* for GStreamer 1.24.*
    "meson==1.11.*",
    "ninja",
    "jinja2-cli",
    "numpy",  # using opencv configuer
    "gitlint",
    "setuptools<81.0.0",
    "markdown",
    "mako",
    "pydevd",
    "Cython",
    "build",
    "pytest"
]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
