## logger
# Valid levels are OFF, FATAL, ERROR, WARN, INFO, DEBUG, TRACE, and ALL.
loglevel=INFO
outputdir=logs
pattern=[%p] %D{%Y/%m/%d %H:%M:%S.%q} -- %m%n

log4cplus.rootLogger=ERROR, console
log4cplus.logger.main=${loglevel}, logfile

# null
log4cplus.appender.null=log4cplus::NullAppender

# console
log4cplus.appender.console=log4cplus::ConsoleAppender
log4cplus.appender.console.layout=log4cplus::PatternLayout
log4cplus.appender.console.layout.ConversionPattern=${pattern}

# logfile
log4cplus.appender.logfile=log4cplus::DailyRollingFileAppender
log4cplus.appender.logfile.File=${outputdir}/app.log
log4cplus.appender.logfile.DatePattern=%Y-%m-%d.log
log4cplus.appender.LogFile.Append=true
log4cplus.appender.LogFile.ImmediateFlush=true
log4cplus.appender.logfile.CreateDirs=true
log4cplus.appender.logfile.MaxFileSize=16MB
log4cplus.appender.logfile.MaxBackupIndex=5
log4cplus.appender.logfile.Schedule=DAILY
log4cplus.appender.logfile.layout=log4cplus::PatternLayout
log4cplus.appender.logfile.layout.ConversionPattern=${pattern}

# debug
log4cplus.appender.debug=log4cplus::Win32DebugAppender
log4cplus.appender.debug.layout=log4cplus::PatternLayout
log4cplus.appender.debug.layout.ConversionPattern=${pattern}
